# Warm-up configuration. No secrets in this file.

timezone: America/New_York          # Trilles AI, St. Petersburg FL
start_date: 2026-10-22              # Week 1 day 1. A later date shifts every week by the same number of days.
weekdays_only: true
extra_working_days: [2026-11-07]   # one-off weekend days to send on (user asked to start today)
working_hours: {start: "09:00", end: "17:00"}

# Per inbox, per day: [min, max] NEW emails. Replies come on top (up to reply_daily_cap).
# (Until 12 Nov 2026 the ranges counted new sends + replies together.)
calendar:
  - {week: 1, range: [5, 10]}
  - {week: 2, range: [10, 15]}
  - {week: 3, range: [20, 30]}
  - {week: 4, range: [20, 30]}       # Week 4 and later: 20-30 new emails per inbox per day

# One-off: 7 Nov, bounce notices from an outside inbox-placement test (sent from salman@) were mistaken for
# warm-up bounces. This clears that false alert/pause once. Notices that don't name a warm-up address are now ignored.
reset_alert_id: "2026-11-07-placement-test-dsns"
reset_bounces_since: "2026-11-07"

hard_daily_cap: 30                  # New emails: never exceeded per inbox per day, whatever the calendar says.
reply_daily_cap: 25                 # Replies per inbox per day, on top of the new emails.
gap_minutes: [5, 15]                # Gap between consecutive sends inside a sending burst.
reply_delay_minutes: [20, 240]
no_repeat_days: 14                  # Same subject never sent twice by the same inbox in this window.
bounce_pause_threshold: 0.02        # Bounce rate (last 7 days) above this pauses the inbox...
pause_days: 7                       # ...for this many days.
lookback_days: 2                    # How far back to look for incoming warm-up mail / bounces.

address: "7901 4th St N, Ste 300\nSt. Petersburg, FL 33702"
company: Trilles AI

inboxes:
  awais:
    email: awais@trilles-ai.com
    full_name: "Awais"
    title: "Founder & CEO"
  salman:
    email: salman@trilles-ai.com
    full_name: "Salman"
    title: "Founder & CTO"
  kinza:
    email: kinza@trilles-ai.com
    full_name: "Kinza"
    title: "Growth Engineer"

# Outside recipients (send-only seeds). Each inbox sends this share of its NEW emails to them instead of to
# another warm-up inbox. Replies are done by hand; the tool never logs in to these accounts.
external_share: 0.25
external_seeds:
  - {name: salman_gmail, email: salmansalu1078@gmail.com, full_name: Salman}
  - {name: awais_gmail, email: letsautomatewithawais@gmail.com, full_name: Awais}
  - {name: salman_trillesai, email: salman@trillesai.com, full_name: Salman}
  - {name: awais_trillesai, email: awais@trillesai.com, full_name: Awais}
  - {name: awais_powerbanc, email: awais@powerbanclending.com, full_name: Awais}

# GitHub Actions only sends for real when this is true (the CLI itself always needs --live).
github_actions_live: true

paths:
  secrets_dir: secrets
  data_dir: data

# Optional Google Sheets logging ("Daily Scoreboard").
sheets:
  enabled: true
  spreadsheet_id: "1KLxBnY9UV76m9rcUf-9ciJwfiU2II6EF-0LPPIDqAxI"   # "Email Warmup Sheet"
  token_inbox: salman               # whose OAuth token also carries the Sheets scope
  tab: "warm-up"
  # mode "upsert": one row per inbox per day (date, inbox, sent, replied, rescued, problems), updated every run
  # mode "row": finds the row whose column A is row_label and the column whose row-1 header is today's date,
  #             and writes "S x / R y / Sp z / P n" (all inboxes combined) into that cell.
  mode: upsert
  row_label: "warm-up"
